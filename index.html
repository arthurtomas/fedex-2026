<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Your Inner Animal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><span id="paw-emoji">🐾</span> Discover Your Inner Animal</h1>
            <p class="subtitle">A personality test for FedEx Day 2026</p>
        </header>

        <div id="welcome-screen" class="screen active">
            <div class="welcome-content">
                <h2>Welcome!</h2>
                <p>Answer 7 questions and find out which animal best represents your work personality.</p>
                <div class="input-group">
                    <label for="user-name">What is your name?</label>
                    <input type="text" id="user-name" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Do you hold a leadership position?</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="leadership" value="yes">
                            <span>Yes</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="leadership" value="no" checked>
                            <span>No</span>
                        </label>
                    </div>
                </div>
                <button id="start-btn" class="btn-primary">Start</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
            <div class="question-container">
                <h2 id="question-text"></h2>
                <div id="options-container" class="options"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <div class="result-content">
                <div class="animal-display">
                    <div id="animal-emoji" class="animal-emoji"></div>
                    <h2 id="result-title"></h2>
                </div>
                <div id="stats-info" class="stats-container"></div>
                <p id="result-description" class="result-description"></p>
                <div id="celebrities-list" class="celebrities-container"></div>
                <button id="restart-btn" class="btn-secondary">Take Again</button>
            </div>
        </div>
    </div>

    <!-- Easter Egg Modal -->
    <div id="easter-egg-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img src="animal-images/Creepy-Bear.png" alt="Creepy Bear" class="creepy-bear-img">
            <h2>You found the Creepy Bear!</h2>
            <p>(generated by CAI by the way! 😜)</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
